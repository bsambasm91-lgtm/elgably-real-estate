<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شركة الجبلي للتسويق العقاري</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      padding: 45px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 210px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 25px;
    }

    .company-name {
      margin: 0;
      font-size: 30px;
      color: #d4af37;
      font-weight: bold;
    }

    .line {
      width: 100px;
      height: 2px;
      background: #d4af37;
      margin: 18px auto 30px;
    }

    .properties-title {
      font-size: 26px;
      margin: 0 0 25px;
      color: #fff;
    }

    .properties {
      width: 100%;
      max-width: 850px;
    }

    .property {
      background: #1c1c1c;
      border: 1px solid #d4af37;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .property h3 {
      color: #d4af37;
      margin-top: 0;
    }

    .property p {
      margin-bottom: 0;
      color: #ddd;
    }

    .contact {
      margin-top: 20px;
      padding: 22px;
      width: 100%;
      max-width: 850px;
      border-top: 1px solid #d4af37;
    }

    .contact-title {
      color: #d4af37;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .phone {
      font-size: 25px;
      font-weight: bold;
      direction: ltr;
      color: #fff;
    }

    @media (max-width: 600px) {
      .company-name {
        font-size: 24px;
      }

      .properties-title {
        font-size: 23px;
      }

      .logo {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- اللوجو -->
    <img
      src="logo-1.png"
      alt="لوجو شركة الجبلي للتسويق العقاري"
      class="logo"
    >

    <!-- اسم الشركة -->
    <h1 class="company-name">
      شركة الجبلي للتسويق العقاري
    </h1>

    <div class="line"></div>

    <!-- العقارات المتاحة -->
    <h2 class="properties-title">
      العقارات المتاحة
    </h2>

    <section class="properties">

      <div class="property">
        <h3>🏠 عقارات للبيع</h3>
        <p>شقق • محلات • أراضي • عقارات استثمارية</p>
      </div>

      <div class="property">
        <h3>🏢 عقارات للإيجار</h3>
        <p>شقق • محلات • وحدات إدارية وتجارية</p>
      </div>

    </section>

    <!-- أرقام التواصل -->
    <section class="contact">

      <div class="contact-title">
        أرقام التواصل
      </div>

      <div class="phone">
        01153705060
      </div>

    </section>

  </main>

</body>
</html>
